# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Loom
# 26.1+ uses the 'net.fabricmc.fabric-loom' plugin, which does NOT remap Minecraft
# or mods -- the game is unobfuscated, so there are no mappings at all.
loom_version=1.15-SNAPSHOT

# Minecraft / Fabric
minecraft_version=26.1.2
loader_version=0.18.4
fabric_api_version=0.149.1+26.1.2

# Must match the LWJGL core that Minecraft 26.1.2 ships, verified from the client log.
lwjgl_version=3.4.1

# Mod
mod_version=0.1.0
maven_group=com.strata
archives_base_name=strata
